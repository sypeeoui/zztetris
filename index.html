<!DOCTYPE html>
<html>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
	<script src="rotationSystem.js"></script>
	<script src="io.js"></script>
	<script src="utils.js"></script>
	<script src="tetris-fumen.js"></script>
	<script defer src="base.js"></script>
	<script defer src="tetrio.js"></script>
	<script defer src="zztetris.js"></script>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
	<link rel="icon" href="./assets/pieceSprite/z.png" />
	<link rel="stylesheet" type="text/css" href="styles/zztetris.css" />
	<link rel="stylesheet" type="text/css" href="styles/paint_bucket.css" />
	<link rel="stylesheet" type="text/css" href="styles/import_export.css" />
	<link rel="stylesheet" type="text/css" href="styles/board_settings.css" />
	<head>
		<meta charset="UTF-8" />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://swng.github.io/zztetris/" />
		<meta property="og:title" content="ZZTetris" />
		<meta
			property="og:description"
			content='a tetris client that starts with ZZ so you can type "ZZ" into your address bar and have it autocomplete'
		/>
		<meta
			property="og:image"
			content="https://cdn.discordapp.com/attachments/209687919361916928/898230618012418088/unknown.png"
		/>
		<title>ZZTetris</title>
	</head>
	<body style="background-color: #222; color: #fff">
		<div class="sidebar-nav">
			<div class="nav-section">
				<h3>Navigation</h3>
				<a class="button" target="_blank" href="https://github.com/swng/zztetris#readme">About</a>
				<button class="button" target="popup" onclick="ctrlsPopup()">Game Settings</button>
				<a class="button" href="index.html">Practice</a>
				<a class="button" href="index.html?mode=cheese">Cheese</a>
				<a class="button" href="index.html?mode=4w">4W</a>
				<a class="button" href="index.html?mode=4w4res">4W 4Res</a>
				<a class="button" href="index.html?mode=4w5res">4W 5Res</a>
				<a class="button" href="index.html?mode=4w6res">4W 6Res</a>
				<a class="button" href="index.html?mode=3w">3W</a>
				<a class="button" href="index.html?mode=grav">Grav</a>
				<a class="button" href="index.html?mode=pc">PC</a>
			</div>

			<div class="nav-section">
				<h3>Practice Garbage</h3>
				<div class="practice-row">
					<label for="practiceLayers">Layers:</label>
					<input type="number" id="practiceLayers" min="1" max="20" value="1" />
				</div>
				<div class="practice-row">
					<label for="practiceMessiness">Messiness:</label>
					<input type="range" id="practiceMessiness" min="0" max="100" value="0" />
					<span id="messinessVal">0%</span>
				</div>
				<div class="practice-row">
					<input type="checkbox" id="practicePermanent" />
					<label for="practicePermanent">Permanent</label>
				</div>
				<button class="button" onclick="this.blur(); addPracticeGarbageUI();">Add Garbage</button>
			</div>
		</div>

		<div id="mainLayout" class="main-layout">
			<div class="import-export">
				<div class="exports">
					<h3>Export To</h3>
					<button class="button" onclick="this.blur(); exportFumen()">Fumen</button>
					<button class="button" onclick="this.blur(); exportFullFumen()">Full Fumen</button>
					<button class="button" onclick="this.blur(); exportTetrio()">TETRIO</button>
				</div>

				<div class="imports">
					<h3>Import From</h3>
					<button class="button" onclick="this.blur(); importFumen()">Fumen</button>
					<button class="button" onclick="this.blur(); importFullFumen()">Full Fumen</button>
					<button class="button" onclick="this.blur(); importTetrio()">TETRIO</button>
					<button class="button" onclick="this.blur(); importImageButton()">Image</button>
				</div>
			</div>

			<div class="queue">
				HOLD
				<hr />
				<canvas id="h" width="90" height="60"></canvas>
				<div id="notif" style="width: 90px; text-align: center"></div>
			</div>

			<div>
				<canvas id="b" width="200" height="400" style="padding: 18px"></canvas>
			</div>

			<div class="queue">
				NEXT
				<hr />
				<canvas id="n" width="90" height="360"></canvas>
			</div>

			<div class="board-settings">
				<h3>Options</h3>
				<div class="eval-panel" id="evalPanel">
					<div class="eval-row">
						<input type="checkbox" id="evalModeToggle" />
						<label for="evalModeToggle">Evaluation Mode</label>
					</div>
					<div class="eval-row eval-row--full">
						<button class="button" id="evalAnalyzeBtn" type="button">Analyze</button>
						<button class="button" id="evalToggleOptionsBtn" type="button" disabled>Show Options</button>
					</div>
					<div class="eval-row eval-row--stack">
						<label for="evalEngineType">Engine Type</label>
						<select id="evalEngineType">
							<option value="fusion">Fusion</option>
							<option value="falcon">Falcon</option>
							<option value="cold-clear">Cold Clear 2</option>
						</select>
					</div>
					<div id="coldClearParamsContainer" style="display: none; grid-column: 1 / -1;">
						<div class="eval-row eval-row--stack">
							<label for="coldClearNodes">Nodes</label>
							<input id="coldClearNodes" type="number" min="1" step="100" value="500" />
						</div>
					</div>
					<div class="eval-row">
						<input type="checkbox" id="evalUseWasm" checked />
						<label for="evalUseWasm">Use WASM</label>
					</div>
					<div id="apiBaseContainer" class="eval-row eval-row--stack" style="display: none;">
						<label for="evalApiBase">Engine API</label>
						<input id="evalApiBase" type="text" value="" />
					</div>
					<div class="eval-row eval-row--full">
						<button class="button" id="evalReachabilityBtn" type="button">Reachability: off</button>
					</div>
					<div class="eval-row eval-row--stack">
						<label for="evalInputRate">Playback input/s</label>
						<input id="evalInputRate" type="number" min="0.2" step="0.2" value="2" />
					</div>
					<div class="eval-row eval-row--stack">
						<label for="evalCurrentCombo">Combo</label>
						<input id="evalCurrentCombo" type="number" min="0" step="1" value="0" />
					</div>
					<div class="eval-row eval-row--stack">
						<label for="evalCurrentB2b">B2B</label>
						<input id="evalCurrentB2b" type="number" min="0" step="1" value="0" />
					</div>
					<div class="eval-row eval-row--stack">
						<label for="evalPendingGarbage">Garbage</label>
						<input id="evalPendingGarbage" type="number" min="0" step="1" value="0" />
					</div>
					<div class="eval-row eval-row--stack">
						<label for="evalBeamWidth">Beam width</label>
						<input id="evalBeamWidth" type="number" min="1" step="1" value="500" />
					</div>
					<div class="eval-row eval-row--stack">
						<label for="evalDepth">Depth</label>
						<input id="evalDepth" type="number" min="1" step="1" value="12" />
					</div>

					<div id="fusionParamsContainer" style="grid-column: 1 / -1; display: contents;">
						<div class="eval-row eval-row--stack eval-row--full">
							<label for="evalPreset">Engine Preset</label>
							<div style="display: flex; gap: 4px;">
								<select id="evalPreset" style="flex: 1;">
									<option value="default">Default</option>
									<option value="downstack">Downstack</option>
									<option value="pc">PC</option>
								</select>
								<button class="button" style="padding: 2px 6px; margin: 0; color: #ff5555;" onclick="deleteCustomPreset()" title="Delete current custom preset">X</button>
								<button class="button" style="padding: 2px 6px; margin: 0;" onclick="saveCustomPreset()">Save Custom</button>
							</div>
						</div>
						<div class="eval-row eval-row--stack">
							<label for="evalTimeBudgetMs">Time budget ms</label>
							<input id="evalTimeBudgetMs" type="number" min="1" step="1" value="50" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="evalFutilityDelta">Futility delta</label>
							<input id="evalFutilityDelta" type="number" min="0" step="0.1" value="15" />
						</div>
						<div class="eval-row">
							<input type="checkbox" id="evalUseTt" />
							<label for="evalUseTt">Use TT</label>
						</div>
						<div class="eval-row">
							<input type="checkbox" id="evalExtendQueue" checked />
							<label for="evalExtendQueue">Extend queue 7-bag</label>
						</div>
						<div class="eval-row eval-row--stack">
							<label for="evalAttackWeight">Attack weight</label>
							<input id="evalAttackWeight" type="number" step="0.01" value="0.5" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="evalChainWeight">Chain weight</label>
							<input id="evalChainWeight" type="number" step="0.01" value="1.0" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="evalContextWeight">Context weight</label>
							<input id="evalContextWeight" type="number" step="0.01" value="0.25" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="evalB2bWeight">B2B weight</label>
							<input id="evalB2bWeight" type="number" step="0.01" value="1.0" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="evalDownstackWeight">Downstack weight</label>
							<input id="evalDownstackWeight" type="number" step="0.01" value="0.20" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="evalDownstackAvgHeightWeight">Downstack avg height weight</label>
							<input id="evalDownstackAvgHeightWeight" type="number" step="0.01" value="0.0" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="evalDownstackMinHeightWeight">Downstack min height weight</label>
							<input id="evalDownstackMinHeightWeight" type="number" step="0.01" value="-5.0" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="evalPathDecay">Path decay</label>
							<input id="evalPathDecay" type="number" step="0.01" min="0" max="1" value="1.0" />
						</div>
						<div class="eval-row eval-row--stack">
							<input id="evalPcMode" type="checkbox" />
							<label for="evalPcMode">PC Mode</label>
						</div>
						<div class="eval-row eval-row--stack">
							<label for="evalSpinFullWeight">Spin Full bonus</label>
							<input id="evalSpinFullWeight" type="number" step="0.1" value="8.0" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="evalSpinMiniWeight">Spin Mini bonus</label>
							<input id="evalSpinMiniWeight" type="number" step="0.1" value="2.0" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="evalBoardWeight">Board weight</label>
							<input id="evalBoardWeight" type="number" step="0.01" value="1.0" />
						</div>

						<div class="eval-row eval-row--stack" style="grid-column: 1 / -1;">
							<hr style="border: 0; border-top: 1px solid #444; margin: 10px 0;" />
							<div style="font-weight: bold; margin-bottom: 5px;">Attack Logic</div>
						</div>

						<div class="eval-row eval-row--stack">
							<label for="evalPcGarbage">PC Attack</label>
							<input id="evalPcGarbage" type="number" min="0" step="1" value="5" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="evalPcB2b">PC B2B Bonus</label>
							<input id="evalPcB2b" type="number" min="0" step="1" value="2" />
						</div>
						<div class="eval-row">
							<input type="checkbox" id="evalB2bChaining" checked />
							<label for="evalB2bChaining">B2B Chaining</label>
						</div>
						<div class="eval-row eval-row--stack">
							<label for="evalB2bBonus">B2B Bonus</label>
							<input id="evalB2bBonus" type="number" min="0" step="1" value="1" />
						</div>
						<div class="eval-row eval-row--stack" style="grid-column: 1 / -1;">
							<label for="evalBaseAttack">Base Attack (0,1,2,3,4 lines)</label>
							<input id="evalBaseAttack" type="text" value="0,0,1,2,4" />
						</div>
						<div class="eval-row eval-row--stack" style="grid-column: 1 / -1;">
							<label for="evalMiniSpinAttack">Mini Spin Attack (0,1,2,3,4 lines)</label>
							<input id="evalMiniSpinAttack" type="text" value="0,0,1,2,10" />
						</div>
						<div class="eval-row eval-row--stack" style="grid-column: 1 / -1;">
							<label for="evalSpinAttack">Spin Attack (0,1,2,3,4 lines)</label>
							<input id="evalSpinAttack" type="text" value="0,2,4,6,10" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="evalComboTable">Combo Table</label>
							<select id="evalComboTable">
								<option value="0">Multiplier</option>
								<option value="1">Classic</option>
								<option value="2">Modern</option>
								<option value="3">None</option>
							</select>
						</div>
						<div class="eval-row eval-row--stack">
							<label for="evalQMaxExtensions">Quiescence max ext</label>
							<input id="evalQMaxExtensions" type="number" min="0" step="1" value="3" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="evalQBeamFraction">Quiescence beam frac</label>
							<input id="evalQBeamFraction" type="number" min="0" max="1" step="0.01" value="0.15" />
						</div>
					</div>

					<div id="falconWeightsContainer" style="display: none; grid-column: 1 / -1; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px;">
						<div class="eval-row eval-row--stack">
							<label for="falconWeight_height">Height</label>
							<input id="falconWeight_height" type="number" value="-50" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="falconWeight_upper_half_height">Up Half H</label>
							<input id="falconWeight_upper_half_height" type="number" value="-150" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="falconWeight_upper_quarter_height">Up Qtr H</label>
							<input id="falconWeight_upper_quarter_height" type="number" value="-300" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="falconWeight_center_height">Center H</label>
							<input id="falconWeight_center_height" type="number" value="-100" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="falconWeight_extra_wells">Wells</label>
							<input id="falconWeight_extra_wells" type="number" value="-100" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="falconWeight_clear_none">No Clear</label>
							<input id="falconWeight_clear_none" type="number" value="-70" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="falconWeight_clear_mini">Mini Clr</label>
							<input id="falconWeight_clear_mini" type="number" value="70" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="falconWeight_clear_normal">Norm Clr</label>
							<input id="falconWeight_clear_normal" type="number" value="140" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="falconWeight_sent">Sent</label>
							<input id="falconWeight_sent" type="number" value="0" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="falconWeight_b2b">B2B</label>
							<input id="falconWeight_b2b" type="number" value="80" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="falconWeight_combo">Combo</label>
							<input id="falconWeight_combo" type="number" value="30" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="falconWeight_holes">Holes</label>
							<input id="falconWeight_holes" type="number" value="-15" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="falconWeight_covered_holes">Cov Hole</label>
							<input id="falconWeight_covered_holes" type="number" value="-60" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="falconWeight_overstacked_holes">Ovstk Hol</label>
							<input id="falconWeight_overstacked_holes" type="number" value="-40" />
						</div>
						<div class="eval-row eval-row--stack">
							<label for="falconWeight_unevenness">Uneven</label>
							<input id="falconWeight_unevenness" type="number" value="-30" />
						</div>
					</div>

					<div class="eval-row eval-row--stack eval-row--full">
						<label>Routes</label>
						<div id="evalRoutesList" class="eval-routes-list"></div>
					</div>
					<div class="eval-status" id="evalStatus">Evaluation is disabled.</div>
					<div class="eval-scores" id="evalScores"></div>
					<div class="eval-pv" id="evalPv"></div>
				</div>

				<div id="boardOptionsContent">
					<button class="button button--shuffle" onclick="this.blur(); shuffleQueue();">Queue</button>
					<button class="button button--shuffle" onclick="this.blur(); shuffleQueuePlusHold();">
						Queue + Hold
					</button>

					<button class="button" onclick="this.blur(); mirror()">Mirror</button>
					<button class="button" onclick="this.blur(); fullMirror()">Full Mirror</button>

					<form class="paint-bucket" name="paintbucket">
						<label for="X">
							<input type="radio" name="paintbucket" class="paintbucket" id="X" value="X" checked />
							<span></span>
						</label>
						<label for="I">
							<input type="radio" name="paintbucket" class="paintbucket" id="I" value="I" />
							<span></span>
						</label>
						<label for="J">
							<input type="radio" name="paintbucket" class="paintbucket" id="J" value="J" />
							<span></span>
						</label>
						<label for="S">
							<input type="radio" name="paintbucket" class="paintbucket" id="S" value="S" />
							<span></span>
						</label>
						<label for="O">
							<input type="radio" name="paintbucket" class="paintbucket" id="O" value="O" />
							<span></span>
						</label>
						<label for="Z">
							<input type="radio" name="paintbucket" class="paintbucket" id="Z" value="Z" />
							<span></span>
						</label>
						<label for="L">
							<input type="radio" name="paintbucket" class="paintbucket" id="L" value="L" />
							<span></span>
						</label>
						<label for="T">
							<input type="radio" name="paintbucket" class="paintbucket" id="T" value="T" />
							<span></span>
						</label>
					</form>
					<div><input type="checkbox" checked id="autocolor" /> <label for="autocolor">autocolor</label></div>
					<div><input type="checkbox" checked id="grav" /> <label for="grav">gravity</label></div>
					<p></p>
					<form>
						<label for="garbageCol">Garbage:</label>
						<select name="garbageCol" id="garbageCol">
							<option value=0>0th col</option>
							<option value=1>1th col</option>
							<option value=2>2th col</option>
							<option value=3>3th col</option>
							<option value=4>4th col</option>
							<option value=5>5th col</option>
							<option value=6>6th col</option>
							<option value=7>7th col</option>
							<option value=8>8th col</option>
							<option value=9>9th col</option>
						</select>
					</form>
					<button class="button" onclick="this.blur(); garbage(document.getElementById('garbageCol').value);">Submit</button>
					<form>
						<label for="kickset">Kickset:</label>
						<select name="kickset" id="kickset">
							<option value="SRS+">SRS+</option>
							<option value="SRS">SRS</option>
							<option value="kzl">kzl</option>
							<option value="alge">alge</option>
							<option value="SRS-X">SRS-X</option>
							<option value="Tetra-Online">Tetra-Online</option>
							<option value="ASC">ASC</option>
							<option value="none">none</option>
						</select>
					</form>
					<button class="button" onclick="this.blur(); updateKickTable()">Submit</button>
					<p></p>
					<button class="button" onclick="this.blur(); sfinder()">SFinder</button>
				</div>
			</div>
		</div>

		<div id = "tcc" style class = "tc">
            <div>
                <span id="tc-un"><svg><use xlink:href="./assets/icons/dark.svg#s-un"></use></svg></span>
				<span id="tc-dr"><svg><use xlink:href="./assets/icons/dark.svg#s-r180"></use></svg></span>
                <span id="tc-h"><svg><use xlink:href="./assets/icons/dark.svg#s-hold"></use></svg></span>
                <span id="tc-hd"><svg><use xlink:href="./assets/icons/dark.svg#s-harddrop"></use></svg></span>
                </div>
                <div>
                <span id="tc-l"><svg><use xlink:href="./assets/icons/dark.svg#s-back"></use></svg></span>
                <span id="tc-r"><svg><use xlink:href="./assets/icons/dark.svg#s-forward"></use></svg></span>
                <span id="tc-d"><svg><use xlink:href="./assets/icons/dark.svg#s-down"></use></svg></span>
                <span id="tc-cc"><svg><use xlink:href="./assets/icons/dark.svg#s-ccw"></use></svg></span>
                <span id="tc-c"><svg><use xlink:href="./assets/icons/dark.svg#s-cw"></use></svg></span>
                <span id="tc-re"><svg><use xlink:href="./assets/icons/dark.svg#s-reload"></use></svg></span>
                </div>
            <canvas id="mobile_controls"></canvas>
        </div>
	</body>
</html>
